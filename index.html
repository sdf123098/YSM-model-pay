<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bb1422">
  <title>YSM 模型资源站</title>
  <style>
    :root {
      color-scheme: light;
      --red-950: #5b0d14;
      --red-800: #8f101b;
      --red-700: #bb1422;
      --red-600: #d82435;
      --red-100: #ffe7e9;
      --red-050: #fff6f6;
      --ink: #5b0d14;
      --muted: #9f6267;
      --line: #f2cacc;
      --card: #ffffff;
      --shadow: 0 18px 50px rgba(126, 20, 31, .10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 4% -4%, rgba(216, 36, 53, .16), transparent 30rem),
        radial-gradient(circle at 96% 12%, rgba(187, 20, 34, .10), transparent 24rem),
        var(--red-050);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: linear-gradient(rgba(187, 20, 34, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(187, 20, 34, .035) 1px, transparent 1px);
      background-size: 32px 32px;
      content: "";
      pointer-events: none;
    }

    button, input, select { font: inherit; }
    a { color: inherit; }

    .shell {
      width: min(1440px, calc(100% - 44px));
      margin: 0 auto;
      padding: 24px 0 70px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 13px;
      color: #fff;
      background: var(--red-700);
      box-shadow: 0 9px 20px rgba(187, 20, 34, .22);
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: -.08em;
    }

    .brand-name {
      font-size: .98rem;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--red-800);
      background: rgba(255, 255, 255, .78);
      font-size: .84rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .repo-link:hover { transform: translateY(-2px); border-color: var(--red-600); background: #fff; }
    .repo-link svg { width: 17px; height: 17px; fill: currentColor; }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      overflow: hidden;
      padding: clamp(28px, 5vw, 56px);
      border-radius: 28px;
      color: #fff;
      background: linear-gradient(118deg, var(--red-950), var(--red-700) 58%, var(--red-600));
      box-shadow: var(--shadow);
    }

    .hero::after {
      position: absolute;
      right: -70px;
      bottom: -110px;
      width: 350px;
      height: 350px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 50%;
      box-shadow: 0 0 0 30px rgba(255, 255, 255, .04), 0 0 0 60px rgba(255, 255, 255, .04);
      content: "";
    }

    .eyebrow {
      margin: 0 0 14px;
      color: #ffc8cc;
      font-size: .74rem;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(2.05rem, 5vw, 4.6rem);
      line-height: 1.02;
      letter-spacing: -.065em;
    }

    .hero-copy {
      max-width: 610px;
      margin: 19px 0 0;
      color: #ffe8e9;
      font-size: clamp(.93rem, 1.8vw, 1.08rem);
      line-height: 1.7;
    }

    .hero-stats {
      position: relative;
      z-index: 1;
      display: grid;
      align-content: end;
      grid-template-columns: repeat(3, minmax(85px, 1fr));
      gap: 10px;
      min-width: 290px;
    }

    .stat {
      padding: 13px 14px;
      border: 1px solid rgba(255, 255, 255, .21);
      border-radius: 14px;
      background: rgba(255, 255, 255, .11);
      backdrop-filter: blur(10px);
    }

    .stat-number { font-size: 1.45rem; font-weight: 850; letter-spacing: -.05em; }
    .stat-label { margin-top: 3px; color: #ffc8cc; font-size: .7rem; }

    .browse {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      gap: 10px;
      margin: 22px 0 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 250, 250, .92);
      box-shadow: 0 10px 28px rgba(126, 20, 31, .07);
      backdrop-filter: blur(14px);
    }

    .search-wrap { position: relative; }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 16px;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      fill: none;
      stroke: var(--red-700);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
      pointer-events: none;
    }

    .search {
      width: 100%;
      height: 50px;
      padding: 0 18px 0 46px;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
      color: var(--ink);
      background: #fff;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .search::placeholder { color: #b67a7e; }
    .search:focus, .filter:focus { border-color: var(--red-600); box-shadow: 0 0 0 4px rgba(216, 36, 53, .12); }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 10px;
    }

    .filter {
      min-width: 0;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
    }

    .result-count {
      align-self: center;
      min-width: 84px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    .model-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
      padding-top: 20px;
    }

    .model-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 5px 17px rgba(126, 20, 31, .045);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .model-card:hover {
      transform: translateY(-5px);
      border-color: #e98a91;
      box-shadow: 0 17px 30px rgba(126, 20, 31, .13);
    }

    .preview {
      position: relative;
      height: 168px;
      overflow: hidden;
      background: #fff1f2;
    }

    .preview.default-0 { background: linear-gradient(135deg, #fff8f8, #ffdfe2); }
    .preview.default-1 { background: linear-gradient(135deg, #fff, #ffe7e9); }
    .preview.default-2 { background: linear-gradient(135deg, #ffe7e9, #fff7f7); }
    .preview.default-3 { background: linear-gradient(135deg, #fff, #fbd3d7); }
    .preview.default-4 { background: linear-gradient(135deg, #fff5f5, #ffe1e4); }
    .preview.default-5 { background: linear-gradient(135deg, #ffe1e4, #fffafa); }
    .preview.has-image { background: #fff; }

    .default-art {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--red-700);
    }

    .default-art::before,
    .default-art::after {
      position: absolute;
      border: 1px solid rgba(187, 20, 34, .13);
      border-radius: 50%;
      content: "";
    }

    .default-art::before { width: 210px; height: 210px; transform: translate(-82px, -74px); }
    .default-art::after { width: 150px; height: 150px; transform: translate(124px, 78px); }
    .default-art svg { position: relative; z-index: 1; width: 152px; height: 118px; overflow: visible; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2.2; }
    .default-art .solid { fill: currentColor; stroke: none; }
    .preview.has-image .default-art { display: none; }
    .preview.has-image::after { display: none; }
    }

    .preview::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 44%, rgba(91, 13, 20, .22));
      content: "";
      pointer-events: none;
    }

    .preview-fallback {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      color: rgba(255, 255, 255, .92);
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: -.1em;
    }

    .preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      background: #fff;
      transition: transform .35s ease;
    }

    .model-card:hover .preview img { transform: scale(1.06); }

    .type-badge {
      position: absolute;
      top: 11px;
      left: 11px;
      z-index: 1;
      padding: 5px 8px;
      border: 1px solid rgba(255, 255, 255, .34);
      border-radius: 7px;
      color: #fff;
      background: rgba(91, 13, 20, .52);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .07em;
    }

    .card-body { padding: 14px 15px 15px; }
    .model-name { min-height: 2.65em; margin: 0; font-size: .97rem; font-weight: 800; line-height: 1.34; }
    .model-author { overflow: hidden; margin: 7px 0 0; color: var(--muted); font-size: .78rem; text-overflow: ellipsis; white-space: nowrap; }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #fae0e1;
    }

    .file-size { color: var(--muted); font-size: .73rem; }

    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 78px;
      height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      color: #fff;
      background: var(--red-700);
      font-size: .76rem;
      font-weight: 800;
      text-decoration: none;
      transition: background .18s ease, transform .18s ease;
    }

    .download:hover { transform: translateY(-1px); background: var(--red-800); }
    .download svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }

    .empty {
      grid-column: 1 / -1;
      padding: 76px 0;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1120px) {
      .model-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 800px) {
      .hero { grid-template-columns: 1fr; }
      .hero-stats { min-width: 0; max-width: 440px; }
      .filter-row { grid-template-columns: 1fr 1fr; }
      .result-count { text-align: left; }
      .model-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 540px) {
      .shell { width: min(100% - 24px, 1440px); padding-top: 14px; }
      .brand-name { display: none; }
      .repo-link span { display: none; }
      .repo-link { padding: 10px; }
      .hero { padding: 28px 22px; border-radius: 21px; }
      .hero-stats { grid-template-columns: repeat(3, 1fr); }
      .stat { padding: 10px 8px; }
      .stat-number { font-size: 1.15rem; }
      .filter-row { grid-template-columns: 1fr; }
      .model-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="#">
        <span class="brand-mark">Y</span>
        <span class="brand-name">YSM 模型资源站</span>
      </a>
      <a class="repo-link" href="https://github.com/sdf123098/YSM-model-pay" target="_blank" rel="noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.3 11.3 0 0 0-3.58 22.02c.57.1.77-.25.77-.55v-2.17c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.63 1.22 3.27.93.1-.73.39-1.22.7-1.5-2.5-.28-5.13-1.25-5.13-5.56 0-1.23.44-2.24 1.16-3.03-.12-.28-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.16a10.74 10.74 0 0 1 5.64 0c2.15-1.46 3.09-1.16 3.09-1.16.62 1.55.24 2.7.12 2.98.72.8 1.16 1.8 1.16 3.03 0 4.32-2.64 5.27-5.15 5.55.4.35.76 1.04.76 2.1v3.12c0 .3.2.66.78.55A11.3 11.3 0 0 0 12 .7Z"/></svg>
        <span>GitHub 仓库</span>
      </a>
    </header>

    <section class="hero">
      <div>
        <p class="eyebrow">YES STEVE MODEL / LIBRARY</p>
        <h1>YSM 模型资源站</h1>
        <p class="hero-copy">一站式浏览模型与整合包。每一项资源都直达仓库文件，打开即可下载。</p>
      </div>
      <div class="hero-stats">
        <div class="stat"><div class="stat-number" id="stat-models">0</div><div class="stat-label">模型文件</div></div>
        <div class="stat"><div class="stat-number" id="stat-authors">0</div><div class="stat-label">作者</div></div>
        <div class="stat"><div class="stat-number" id="stat-files">0</div><div class="stat-label">全部资源</div></div>
      </div>
    </section>

    <section class="browse" aria-label="综合筛选">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input class="search" id="search" type="search" placeholder="搜索模型名、作者、仓库路径或文件类型" autocomplete="off" aria-label="搜索模型名、作者、仓库路径或文件类型">
      </div>
      <div class="filter-row">
        <select class="filter" id="author-filter" aria-label="按作者筛选"></select>
        <select class="filter" id="type-filter" aria-label="按文件类型筛选">
          <option value="all">全部文件</option>
          <option value="model">模型文件</option>
          <option value="archive">压缩包</option>
        </select>
        <select class="filter" id="sort-filter" aria-label="排序方式">
          <option value="name">按名称排序</option>
          <option value="author">按作者排序</option>
          <option value="size">按文件大小排序</option>
        </select>
        <span class="result-count" id="result-count"></span>
      </div>
    </section>

    <section class="model-grid" id="models" aria-live="polite"></section>
  </main>

  <script src="models_data.js"></script>
  <script>
    const REPOSITORY_RAW = 'https://github.com/sdf123098/YSM-model-pay/raw/refs/heads/main/';
    const data = window.MODELS_DATA || [];
    const models = data.flatMap(author => [
      ...author.ysms.map(file => ({ ...file, author: author.author })),
      ...author.zips.map(file => ({ ...file, author: author.author }))
    ]);
    const state = { query: '', author: 'all', type: 'all', sort: 'name' };
    const modelsElement = document.getElementById('models');
    const searchElement = document.getElementById('search');
    const authorFilterElement = document.getElementById('author-filter');
    const typeFilterElement = document.getElementById('type-filter');
    const sortFilterElement = document.getElementById('sort-filter');
    const resultCountElement = document.getElementById('result-count');
    const DEFAULT_ART = [
      '<svg viewBox="0 0 180 140" aria-hidden="true"><path d="m90 14 62 35v68l-62 35-62-35V49L90 14Z"/><path d="m28 49 62 36 62-36M90 85v67"/><path class="solid" d="m90 31 39 22-39 22-39-22 39-22Z"/></svg>',
      '<svg viewBox="0 0 180 140" aria-hidden="true"><path d="m90 12 9 35 35-9-26 25 26 25-35-9-9 35-9-35-35 9 26-25-26-25 35 9 9-35Z"/><circle cx="90" cy="68" r="16"/></svg>',
      '<svg viewBox="0 0 180 140" aria-hidden="true"><circle cx="90" cy="70" r="42"/><ellipse cx="90" cy="70" rx="75" ry="25" transform="rotate(-24 90 70)"/><circle class="solid" cx="142" cy="38" r="7"/></svg>',
      '<svg viewBox="0 0 180 140" aria-hidden="true"><path d="M35 30h110v80H35z"/><path d="M35 47h110M55 30v17M125 30v17M55 110V94M125 110V94"/><circle cx="90" cy="78" r="19"/><path d="M90 67v22m-11-11h22"/></svg>',
      '<svg viewBox="0 0 180 140" aria-hidden="true"><circle cx="90" cy="49" r="25"/><path d="M43 126c3-31 18-46 47-46s44 15 47 46M62 42c7-21 49-28 59 2M68 58c13 8 31 8 44 0"/></svg>',
      '<svg viewBox="0 0 180 140" aria-hidden="true"><path d="m90 11 12 45 45 12-45 12-12 45-12-45-45-12 45-12 12-45Z"/><path d="m143 18 5 18 18 5-18 5-5 18-5-18-18-5 18-5 5-18Z"/><circle class="solid" cx="90" cy="68" r="8"/></svg>'
    ];

    function typeOf(model) {
      return model.name.toLocaleLowerCase().endsWith('.ysm') ? 'model' : 'archive';
    }

    function formatSize(size) {
      if (!Number.isFinite(size) || size <= 0) return '';
      return size < 1 ? size.toFixed(2) + ' MB' : size.toFixed(1) + ' MB';
    }

    function encodePath(path) {
      return path.replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/');
    }

    function downloadUrl(path) {
      return REPOSITORY_RAW + encodePath(path);
    }

    function makeDownloadIcon() {
      const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      icon.setAttribute('viewBox', '0 0 24 24');
      icon.setAttribute('aria-hidden', 'true');
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', 'M12 3v12m0 0 4-4m-4 4-4-4M5 21h14');
      icon.append(path);
      return icon;
    }

    function setStats() {
      const modelCount = models.filter(model => typeOf(model) === 'model').length;
      document.getElementById('stat-models').textContent = modelCount.toLocaleString('zh-CN');
      document.getElementById('stat-authors').textContent = data.length.toLocaleString('zh-CN');
      document.getElementById('stat-files').textContent = models.length.toLocaleString('zh-CN');
    }

    function renderAuthorFilter() {
      const authors = [...new Set(models.map(model => model.author))].sort((left, right) =>
        left.localeCompare(right, 'zh-Hans-CN', { sensitivity: 'base' })
      );
      authorFilterElement.replaceChildren();
      const all = document.createElement('option');
      all.value = 'all';
      all.textContent = '全部作者';
      authorFilterElement.append(all);
      authors.forEach(author => {
        const option = document.createElement('option');
        option.value = author;
        option.textContent = author;
        authorFilterElement.append(option);
      });
      authorFilterElement.value = state.author;
    }

    function filteredModels() {
      const query = state.query.toLocaleLowerCase();
      return models
        .filter(model =>
          (state.author === 'all' || model.author === state.author) &&
          (state.type === 'all' || typeOf(model) === state.type) &&
          (query === '' || [model.name, model.author, model.path, typeOf(model)]
            .some(value => value.toLocaleLowerCase().includes(query)))
        )
        .sort((left, right) => {
          if (state.sort === 'author') return left.author.localeCompare(right.author, 'zh-Hans-CN', { sensitivity: 'base' }) || left.name.localeCompare(right.name, 'zh-Hans-CN', { sensitivity: 'base', numeric: true });
          if (state.sort === 'size') return (right.sizeMB || 0) - (left.sizeMB || 0) || left.name.localeCompare(right.name, 'zh-Hans-CN', { sensitivity: 'base', numeric: true });
          return left.name.localeCompare(right.name, 'zh-Hans-CN', { sensitivity: 'base', numeric: true });
        });
    }

    function makePreview(model) {
      const preview = document.createElement('div');
      let hash = 0;
      for (const character of model.name) hash = (hash * 31 + character.charCodeAt(0)) >>> 0;
      const artIndex = hash % DEFAULT_ART.length;
      preview.className = 'preview default-' + artIndex;
      const artwork = document.createElement('div');
      artwork.className = 'default-art';
      artwork.innerHTML = DEFAULT_ART[artIndex];
      preview.append(artwork);

      if (model.preview) {
        const image = document.createElement('img');
        image.src = downloadUrl(model.preview);
        image.alt = '';
        image.loading = 'lazy';
        image.addEventListener('load', () => preview.classList.add('has-image'));
        image.addEventListener('error', () => {
          image.remove();
          preview.classList.remove('has-image');
        });
        preview.append(image);
      }

      const badge = document.createElement('span');
      badge.className = 'type-badge';
      badge.textContent = typeOf(model) === 'model' ? '.YSM' : '.' + model.name.split('.').pop().toUpperCase();
      preview.append(badge);
      return preview;
    }

    function renderModels() {
      const visible = filteredModels();
      modelsElement.replaceChildren();
      resultCountElement.textContent = visible.length.toLocaleString('zh-CN') + ' 项';

      if (!visible.length) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = '没有匹配的资源';
        modelsElement.append(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      visible.forEach(model => {
        const card = document.createElement('article');
        card.className = 'model-card';
        card.append(makePreview(model));

        const body = document.createElement('div');
        body.className = 'card-body';
        const name = document.createElement('h2');
        name.className = 'model-name';
        name.textContent = model.name;
        name.title = model.name;
        const author = document.createElement('p');
        author.className = 'model-author';
        author.textContent = model.author;

        const footer = document.createElement('div');
        footer.className = 'card-footer';
        const size = document.createElement('span');
        size.className = 'file-size';
        size.textContent = formatSize(model.sizeMB);
        const download = document.createElement('a');
        download.className = 'download';
        download.href = downloadUrl(model.path);
        download.target = '_blank';
        download.rel = 'noreferrer';
        download.setAttribute('aria-label', '下载 ' + model.name);
        download.append(makeDownloadIcon(), document.createTextNode('下载'));
        footer.append(size, download);
        body.append(name, author, footer);
        card.append(body);
        fragment.append(card);
      });
      modelsElement.append(fragment);
    }

    function render() {
      renderAuthorFilter();
      renderModels();
    }

    searchElement.addEventListener('input', event => {
      state.query = event.target.value.trim();
      renderModels();
    });
    authorFilterElement.addEventListener('change', event => {
      state.author = event.target.value;
      renderModels();
    });
    typeFilterElement.addEventListener('change', event => {
      state.type = event.target.value;
      renderModels();
    });
    sortFilterElement.addEventListener('change', event => {
      state.sort = event.target.value;
      renderModels();
    });

    setStats();
    render();
  </script>
</body>
</html>
